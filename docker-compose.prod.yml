# SecOpsMonitor - Production Docker Setup (PostgreSQL + Redis)
# Usage: docker compose -f docker-compose.prod.yml up --build
# UI: http://localhost:3000  |  API: http://localhost:8000/docs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secopsmonitor
      POSTGRES_PASSWORD: secopsmonitor
      POSTGRES_DB: secopsmonitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secopsmonitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  monitor-api:
    build:
      context: ./monitor-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      SECOPS_DATABASE_URL: postgresql+asyncpg://secopsmonitor:secopsmonitor@postgres:5432/secopsmonitor
      SECOPS_REDIS_URL: redis://redis:6379/0
      SECOPS_SECRET_KEY: change-me-in-production
      SECOPS_CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ui-monitor:
    build:
      context: ./ui-monitor
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - monitor-api

  celery-worker:
    build:
      context: ./monitor-api
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      SECOPS_DATABASE_URL: postgresql+asyncpg://secopsmonitor:secopsmonitor@postgres:5432/secopsmonitor
      SECOPS_REDIS_URL: redis://redis:6379/0
      SECOPS_SECRET_KEY: change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
